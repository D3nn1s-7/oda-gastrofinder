<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Gastrofinder App Icon</title>
  <desc id="desc">Gourmet Cloche mit Besteck und goldenen Akzenten auf waldgrünem ODAS-Hintergrund.</desc>
  <defs>
    <!-- Hintergrund-Gradient (Gastrofinder Gourmet Waldgrün) -->
    <linearGradient id="gfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193629"/>
      <stop offset="50%" stop-color="#224834"/>
      <stop offset="100%" stop-color="#28543d"/>
    </linearGradient>

    <!-- Gold/Kupfer-Akzent Gradient -->
    <linearGradient id="gfGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d179"/>
      <stop offset="50%" stop-color="#d59b2d"/>
      <stop offset="100%" stop-color="#a66b32"/>
    </linearGradient>

    <!-- Teller-Glow / Tiefe -->
    <radialGradient id="gfCenterGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#3d6c52" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#193629" stop-opacity="0"/>
    </radialGradient>

    <!-- ODAS Standard Tiefenschatten -->
    <filter id="gfIconShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1610" flood-opacity="0.45"/>
    </filter>
    <filter id="gfPlateShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a1610" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hintergrund: Abgerundetes ODAS-Quadrat rx=108, ry=108 -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#gfBgGrad)"/>

  <!-- Subtiler Licht-Glow im Zentrum -->
  <circle cx="256" cy="270" r="180" fill="url(#gfCenterGlow)"/>

  <!-- Glanz-Overlay oben-links für Tiefenwirkung (ODAS Design-Sprache) -->
  <ellipse cx="160" cy="140" rx="190" ry="160" fill="#ffffff" fill-opacity="0.07"/>

  <!-- Hauptmotiv mit Schlagschatten -->
  <g filter="url(#gfIconShadow)">

    <!-- Goldener Akzent-Ring unter dem Servierteller -->
    <ellipse cx="256" cy="358" rx="174" ry="24" fill="url(#gfGoldGrad)" opacity="0.9"/>

    <!-- Servierplatte / Teller-Basis (Ivory / warmweiß) -->
    <ellipse cx="256" cy="352" rx="168" ry="20" fill="#fdf8ed"/>
    <ellipse cx="256" cy="350" rx="156" ry="15" fill="#f4ecdc"/>

    <!-- Cloche-Kuppel (Gourmet-Speiseglocke) -->
    <path d="M 124 336 C 124 200 178 174 256 174 C 334 174 388 200 388 336 Z" fill="#ffffff"/>

    <!-- Cloche-Lichtglanz auf der linken Kuppelseite -->
    <path d="M 148 328 C 146 226 186 194 238 184 C 210 196 176 226 174 328 Z" fill="#ffffff" fill-opacity="0.35"/>

    <!-- Cloche-Kuppel Randwulst (unterer Abschluss) -->
    <path d="M 116 334 C 116 328 124 326 134 326 L 378 326 C 388 326 396 328 396 334 C 396 340 388 344 378 344 L 134 344 C 124 344 116 340 116 334 Z" fill="url(#gfGoldGrad)"/>

    <!-- Cloche-Griff (Knauf oben) -->
    <!-- Goldener Sockel -->
    <ellipse cx="256" cy="174" rx="22" ry="7" fill="url(#gfGoldGrad)"/>
    <!-- Hals -->
    <path d="M 248 174 L 248 152 C 248 146 264 146 264 152 L 264 174 Z" fill="url(#gfGoldGrad)"/>
    <!-- Goldene Kugel / Knauf -->
    <circle cx="256" cy="144" r="18" fill="url(#gfGoldGrad)"/>
    <!-- Lichtpunkt Knauf -->
    <circle cx="251" cy="139" r="5" fill="#ffffff" fill-opacity="0.8"/>

    <!-- Aufsteigender Aromadampf (3 geschwungene Linien) -->
    <path d="M 226 116 C 220 102 228 92 224 80" stroke="#fdf8ed" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 256 112 C 252 96 262 86 258 70" stroke="#fdf8ed" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 286 116 C 292 102 284 92 288 80" stroke="#fdf8ed" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Linkes Besteck: Gourmet-Gabel (vertikal links) -->
    <g transform="translate(62, 192)">
      <!-- Gabelgriff -->
      <path d="M 20 190 L 16 70 C 16 60 24 60 24 70 L 20 190 Z" fill="#fdf8ed"/>
      <ellipse cx="20" cy="190" rx="4" ry="3" fill="#fdf8ed"/>
      <!-- Gabel-Körper -->
      <path d="M 12 66 C 12 50 28 50 28 66 Z" fill="#fdf8ed"/>
      <!-- Zinken (4 tines) -->
      <line x1="12" y1="52" x2="12" y2="18" stroke="#fdf8ed" stroke-width="3" stroke-linecap="round"/>
      <line x1="17" y1="52" x2="17" y2="14" stroke="#fdf8ed" stroke-width="3" stroke-linecap="round"/>
      <line x1="23" y1="52" x2="23" y2="14" stroke="#fdf8ed" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="52" x2="28" y2="18" stroke="#fdf8ed" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Rechtes Besteck: Gourmet-Messer (vertikal rechts) -->
    <g transform="translate(412, 192)">
      <!-- Messergriff -->
      <path d="M 18 190 L 16 78 C 16 68 22 68 22 78 L 20 190 Z" fill="#fdf8ed"/>
      <ellipse cx="19" cy="190" rx="3.5" ry="3" fill="#fdf8ed"/>
      <!-- Messerklinge mit eleganter Rundung -->
      <path d="M 16 78 L 16 20 C 16 12 24 24 25 38 L 25 78 Z" fill="#fdf8ed"/>
    </g>

    <!-- Kleiner Stern-Akzent oben rechts der Cloche (Gourmet-Qualität) -->
    <path d="M 334 140 L 337 148 L 345 151 L 337 154 L 334 162 L 331 154 L 323 151 L 331 148 Z" fill="url(#gfGoldGrad)" opacity="0.85"/>
  </g>
</svg>
